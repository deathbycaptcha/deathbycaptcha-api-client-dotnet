name: Integration Tests Playwright

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  integration-playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore
        run: dotnet restore dbc_api_net.sln

      - name: Build
        run: dotnet build dbc_api_net.sln -c Release --no-restore

      - name: Install Playwright browsers
        run: |
          dotnet build DeathByCaptcha/DeathByCaptcha.Tests/DeathByCaptcha.Tests.csproj -c Release -f net10.0
          pwsh -Command "dotnet tool install --global Microsoft.Playwright.CLI; playwright install --with-deps chromium"

      - name: Check integration secrets
        id: secrets-check
        run: |
          if [ -z "${{ secrets.DBC_USERNAME }}" ] || [ -z "${{ secrets.DBC_PASSWORD }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (missing secrets)
        if: steps.secrets-check.outputs.missing == 'true'
        run: |
          echo "DBC_USERNAME/DBC_PASSWORD are not configured in repository secrets."
          echo "Skipping playwright integration tests."

      - name: Run playwright integration tests (net10)
        if: steps.secrets-check.outputs.missing == 'false'
        env:
          DBC_USERNAME: ${{ secrets.DBC_USERNAME }}
          DBC_PASSWORD: ${{ secrets.DBC_PASSWORD }}
          DBC_PLAYWRIGHT_HEADLESS: "true"
          DBC_PLAYWRIGHT_PAGE_URL: "https://www.google.com/recaptcha/api2/demo"
        run: |
          dotnet test DeathByCaptcha/DeathByCaptcha.Tests/DeathByCaptcha.Tests.csproj \
            -c Release --no-build -f net10.0 \
            --filter "Category=Playwright" \
            --logger "console;verbosity=normal"
